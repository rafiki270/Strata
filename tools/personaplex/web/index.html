<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PersonaPlex Voice</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101722; color: #f2f7fb; }
    body { margin: 0; }
    main { width: min(38rem, calc(100% - 2.5rem)); margin: clamp(2rem, 12vh, 8rem) auto; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -.04em; }
    p { color: #acbdce; line-height: 1.55; }
    button { padding: .85rem 1.2rem; border: 0; border-radius: .6rem; font: inherit; font-weight: 650;
             color: #09251e; background: #62e4c5; cursor: pointer; }
    button:disabled { color: #a8b5c4; background: #26374d; cursor: default; }
    #status { margin-top: 1rem; min-height: 1.6rem; }
    #transcript { white-space: pre-wrap; color: #f2f7fb; }
  </style>
  <script type="module" src="/assets/voice.js"></script>
</head>
<body>
  <main>
    <h1>PersonaPlex 7B</h1>
    <p>Talk to the model and hear its replies live.</p>
    <button type="button" id="toggle">Start conversation</button>
    <p id="status" role="status"></p>
    <p id="transcript" aria-label="PersonaPlex transcript"></p>
  </main>
</body>
</html>
